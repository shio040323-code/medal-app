<style>
*{box-sizing:border-box} body{margin:0;background:#0b1020;color:#f5f7ff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Meiryo,sans-serif}
header{position:sticky;top:0;background:rgba(13,19,39,.97);color:#f5f7ff;border-bottom:1px solid #343d5b;padding:10px;z-index:5;backdrop-filter:blur(10px)}
h1{font-size:20px;margin:0 0 8px;letter-spacing:.02em} .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.rarity{display:inline-flex;align-items:center;gap:6px;font-size:11px;line-height:1.25;font-weight:800;border:1px solid #69728c;border-radius:7px;padding:4px 7px;margin:0 4px 3px 0;color:#e8edf9;background:linear-gradient(135deg,#42495f,#171d31);box-shadow:inset 0 1px 0 #ffffff24,0 2px 5px #0003;letter-spacing:.01em}.rarity::before{content:"";display:inline-block;width:20px;height:20px;flex:0 0 20px;background:linear-gradient(145deg,#fff,#c6cee4 55%,#7b88a8);filter:drop-shadow(0 1px 2px #0008)}
.rarity.common{color:#e5e9f4;border-color:#8a91a6}.rarity.uncommon{color:#f0e6ff;border-color:#c3a5f6;background:linear-gradient(135deg,#61517d,#28203d)}.rarity.rare{color:#ffd49b;border-color:#cf8a42;background:linear-gradient(135deg,#8d4c21,#332015)}.rarity.super{color:#e1eaff;border-color:#b9c5e7;background:linear-gradient(135deg,#606b86,#252c40)}.rarity.legendary{color:#ffe58a;border-color:#e7bd42;background:linear-gradient(135deg,#8c6818,#33270c)}.rarity.epic{color:#f3dcff;border-color:#d77bff;background:linear-gradient(135deg,#7d36a4,#24123e)}.rarity.enchanted{color:#e6f7ff;border-color:#c4d7ed;background:linear-gradient(135deg,#8a9db8,#26364e)}.rarity.iconic{color:#fff0ff;border-color:#ff79d5;background:linear-gradient(135deg,#e88ac7,#3e64d5 55%,#44d6c2)}
.rarity.common::before{border-radius:50%;clip-path:circle(48%);background:linear-gradient(135deg,#fff,#9ba8c7)}.rarity.uncommon::before{clip-path:polygon(10% 0,90% 0,90% 55%,50% 100%,10% 55%);background:linear-gradient(135deg,#fff,#c7b6ff)}.rarity.rare::before{clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(135deg,#ffd08b,#b76522)}.rarity.super::before{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:linear-gradient(135deg,#fff,#9caacb)}.rarity.legendary::before{clip-path:polygon(50% 0,97% 35%,79% 92%,21% 92%,3% 35%);background:linear-gradient(135deg,#fff3a6,#d59a17)}.rarity.epic::before{clip-path:polygon(0 72%,0 52%,3% 36%,9% 22%,19% 10%,32% 3%,43% 0,50% 0,57% 0,68% 3%,81% 10%,91% 22%,97% 36%,100% 52%,100% 72%,83% 80%,67% 88%,50% 100%,33% 88%,17% 80%);background-color:#ff8ee8;background-image:radial-gradient(circle at 25% 30%,#fff7b5 0 2px,transparent 2.5px),radial-gradient(circle at 65% 45%,#fff7b5 0 2px,transparent 2.5px),radial-gradient(circle at 45% 65%,#fff7b5 0 2px,transparent 2.5px),linear-gradient(135deg,#58dfff,#ffe7a0 42%,#ff83dc 72%,#b7a0ff)}.rarity.enchanted::before{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:linear-gradient(135deg,#fff,#8c9cb8)}.rarity.iconic::before{clip-path:polygon(28% 0,72% 0,100% 28%,100% 72%,72% 100%,28% 100%,0 72%,0 28%);background:linear-gradient(135deg,#ffb8e8,#52d9ff 55%,#d9ff8b)}
.high-only #ownership{display:none}
input,button,select{font-size:15px;padding:9px;border:1px solid #4d5878;border-radius:8px;background:#171f36;color:#f5f7ff} input{min-width:0;flex:1} input::placeholder{color:#aeb8d0}
button{cursor:pointer} button:hover{filter:brightness(1.15)} .primary{background:linear-gradient(135deg,#176fc1,#5735a5);color:#fff;border:1px solid #628ee2;font-weight:800;box-shadow:0 3px 10px #0003}
#status{font-size:12px;color:#b8c2dc;margin-top:6px;min-height:16px}
#resetPasswordPanel{display:none;position:fixed;inset:0;z-index:50;background:#080d1bfa;padding:20px;align-items:center;justify-content:center}#resetPasswordPanel .reset-box{width:min(100%,420px);background:#202943;border:1px solid #596789;border-radius:16px;padding:20px;box-shadow:0 15px 50px #0009}#resetPasswordPanel h2{margin:0 0 12px;font-size:20px}#resetPasswordPanel input{width:100%;margin:7px 0;flex:none}#resetPasswordPanel button{margin-top:8px}
#filters{display:flex;gap:6px} #search{width:100%;margin-top:6px}
#inkFilters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.ink-filter{padding:7px 10px;border-radius:8px;font-size:12px;font-weight:800;border:2px solid transparent;color:#172033}
.ink-filter.active{outline:2px solid #fff;box-shadow:0 0 0 3px #6c8bd4}
.ink-filter[data-ink="all"],.ink-filter[data-ink="dual"]{background:#f5f7ff;color:#172033;border-color:#aab5cc}
.ink-filter{color:#172033!important;text-shadow:none;white-space:nowrap}
.card .code,.card .name,.card .counts,.card .count-chip,.card .count-chip b{color:#172033!important}
.card .count-chip .fnum{color:#b00020!important}
.card.owned{opacity:1}
.ink-filter[data-ink="amber"]{background:#FFE48F}.ink-filter[data-ink="amethyst"]{background:#C7A1E3}.ink-filter[data-ink="emerald"]{background:#9BFFC8}.ink-filter[data-ink="ruby"]{background:#FFA7A7}.ink-filter[data-ink="sapphire"]{background:#B9EDFF}.ink-filter[data-ink="steel"]{background:#CDCDCD}
#cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:8px;align-items:start}
.card{display:grid;grid-template-columns:minmax(0,1fr) 32px 32px;align-items:stretch;gap:0;background:#fff;border:1px solid #222;border-radius:0;padding:0;box-shadow:none;min-width:0;color:#172033;cursor:pointer;break-inside:avoid}.card.owned,.card.not-owned{opacity:1;border-color:#222;box-shadow:none}
.card .code{font-weight:850;font-size:12px;letter-spacing:.02em;color:#172033!important;padding:4px 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}.card .name{display:block;grid-column:1/-1;font-size:10px;line-height:1.2;padding:1px 5px 4px;min-height:0;overflow-wrap:anywhere;color:#172033!important}
.card .rarity{display:inline-flex;align-self:center;justify-self:start;font-size:12px;line-height:1;padding:0;margin:0 3px 0 0;border:0;background:transparent!important;color:#172033!important;box-shadow:none;gap:0}.card .rarity::before{width:18px;height:18px;flex-basis:18px;filter:none;margin-right:2px}
.counts{display:contents}.count-chip{display:flex;align-items:center;justify-content:center;gap:3px;border-left:0!important;font-size:12px;color:#172033!important;min-height:30px}.count-chip b{font-size:16px;color:#172033!important}.count-chip .fnum{color:#b00020!important}.edit-count{display:none} .card .code-line{display:flex;align-items:center;min-width:0;overflow:hidden;grid-column:1/-1;border-bottom:1px solid #333}.card .code-line .code{flex:1}
@media(max-width:600px){#cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:6px}.card{grid-template-columns:minmax(0,1fr) 28px 28px}.card .code{font-size:11px;padding:4px 3px}.card .rarity::before{width:16px;height:16px;flex-basis:16px}.count-chip{font-size:11px}.count-chip b{font-size:14px}}
#inputScreen{position:fixed;inset:0;z-index:20;background:#080d1bfa;display:none;overflow:auto;padding: max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom))}.input-panel{max-width:440px;margin:0 auto;background:linear-gradient(145deg,#202943,#11182a);border:1px solid #596789;border-radius:18px;padding:16px;box-shadow:0 15px 50px #0009}.input-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.input-head h2{font-size:18px;margin:0}.input-name{color:#cbd5ee;font-size:13px;margin:7px 0 14px}.counter{display:grid;grid-template-columns:62px 52px 1fr 52px;gap:8px;align-items:center;margin:12px 0}.counter label{font-weight:900}.counter label.f{color:#ff7777}.counter button{font-size:24px;font-weight:900;padding:8px 0;min-height:48px}.counter .minus{background:#303a54}.counter .plus{background:#245c9a}.count-value{font-size:25px;text-align:center;background:#f6f8ff;color:#10172a;border-radius:9px;padding:9px 3px;font-weight:900;min-width:0}.count-value.active{outline:3px solid #69baff}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.keypad button{font-size:23px;font-weight:800;min-height:52px;background:#202b45}.keypad .utility{font-size:15px;background:#35415d}.input-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.input-actions button{flex:1;min-height:46px}.input-actions .nav-button{background:#303a54;color:#f5f7ff;border-color:#697796}.hint{font-size:11px;color:#aebbd8;margin-top:9px}.keyboard-hint{font-size:12px;color:#b9c8e8;margin-top:8px}.count-value{user-select:none}
/* 高レア画面にも通常コレクション表と同じ一覧表示を適用 */
.high-only #cards{grid-template-columns:repeat(3,minmax(0,1fr));}
.high-only .card{grid-template-columns:minmax(0,1fr) 32px 32px;border-left:0!important;border-right:0!important;}
.high-only .card .rarity{display:inline-flex;font-size:14px;}
.high-only .card .rarity::before{width:24px;height:24px;flex-basis:24px;margin-right:3px;}
.high-only .card .count-chip{font-size:14px;min-height:34px;border-left:0!important;}
.high-only .card .count-chip b{font-size:20px;}
@media(max-width:600px){.high-only #cards{grid-template-columns:repeat(2,minmax(0,1fr));}.high-only .card .rarity::before{width:20px;height:20px;flex-basis:20px}.high-only .card .count-chip{font-size:12px}.high-only .card .count-chip b{font-size:17px}}
@media(min-width:1000px){#cards{grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:10px}}

/* 印刷専用レイアウト：A4縦・最大210枚を1ページに配置 */
#printTableWrap{display:none}
@media print{
 @page{size:A4 portrait;margin:4mm}
 html,body{width:202mm!important;height:289mm!important;margin:0!important;padding:0!important;background:#fff!important;color:#111!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 body{display:block!important}
 header,#inputScreen,#resetPasswordPanel,#cards{display:none!important}
 #printTableWrap{display:block!important;position:static!important;width:202mm!important;height:289mm!important;max-width:202mm!important;margin:0!important;padding:0!important;overflow:hidden!important;font-family:Arial,Meiryo,sans-serif}
 #printTitle{display:block!important;height:5mm;line-height:5mm;font-size:7pt;font-weight:800;margin:0;padding:0;box-sizing:border-box}
 #printGrid{display:grid!important;position:static!important;width:202mm!important;height:284mm!important;grid-template-columns:repeat(7,minmax(0,1fr))!important;grid-template-rows:repeat(30,minmax(0,1fr))!important;grid-auto-flow:column!important;column-gap:1mm!important;row-gap:0!important;box-sizing:border-box!important;overflow:hidden!important}
 .print-cell{width:auto!important;height:auto!important;min-width:0!important;min-height:0!important;display:flex!important;align-items:center!important;gap:.5mm!important;padding:0 .35mm!important;border-bottom:.15mm solid #ccc!important;box-sizing:border-box!important;overflow:hidden!important;white-space:nowrap!important;break-inside:avoid!important}
 .print-code{display:inline-flex!important;flex:0 0 auto!important;width:15mm!important;min-width:15mm!important;max-width:15mm!important;height:4.2mm!important;align-items:center!important;justify-content:center!important;box-sizing:border-box!important;padding:.3mm!important;border-radius:.5mm!important;font-size:5.3pt!important;line-height:1!important;font-weight:900!important;color:#111!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:clip!important}
 .print-rarity{display:inline-flex!important;flex:0 0 2.2mm!important;width:2.2mm!important;height:2.4mm!important;min-width:2.2mm!important;max-width:2.2mm!important;align-items:center!important;justify-content:center!important;overflow:hidden!important;padding:0!important;margin:0!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;color:transparent!important;font-size:0!important;line-height:1!important}
 .print-rarity::before{content:""!important;display:inline-block!important;width:2mm!important;height:2mm!important;flex:0 0 2mm!important;margin:0!important;filter:none!important}
 .print-counts{display:inline-flex!important;flex:1 1 auto!important;min-width:0!important;align-items:center!important;justify-content:flex-end!important;gap:.5mm!important;margin-left:auto!important;font-size:4.4pt!important;line-height:1!important;white-space:nowrap!important}
 .print-counts span{display:inline-block!important;white-space:nowrap!important}
 .print-code.dual-chip{background:linear-gradient(135deg,var(--ink1) 0 49%,var(--ink2) 51% 100%)!important}
}
</style>
</head>
<body class="collection-page">
<header>
<h1>ロルカナ コレクション表</h1>
<div class="row"><button id="back">← 未取得カードへ戻る</button><button id="highButton" class="primary">高レア</button><button id="printButton" type="button">印刷</button><span id="total" style="align-self:center;font-size:13px;color:#666"></span></div>
<div class="row">
<input id="email" type="email" placeholder="Supabase登録メール" autocomplete="username">
<input id="password" type="password" placeholder="パスワード" autocomplete="current-password">
<button class="primary" id="login">ログイン</button>
<button id="forgotPassword">パスワード再設定メール</button>
<button id="logout" style="display:none">ログアウト</button>
</div>
<div class="row"><select id="set"><option value="">すべてのJA</option></select><select id="ownership"><option value="all">すべて</option><option value="missing">未取得（N=0）</option><option value="owned">取得済み（N≥1）</option></select></div>
<div id="inkFilters" aria-label="インク色フィルター">
<button type="button" class="ink-filter active" data-ink="all">すべて</button>
<button type="button" class="ink-filter" data-ink="dual">デュアルインク</button>
<button type="button" class="ink-filter" data-ink="amber">アンバー</button>
<button type="button" class="ink-filter" data-ink="amethyst">アメジスト</button>
<button type="button" class="ink-filter" data-ink="emerald">エメラルド</button>
<button type="button" class="ink-filter" data-ink="ruby">ルビー</button>
<button type="button" class="ink-filter" data-ink="sapphire">サファイア</button>
<button type="button" class="ink-filter" data-ink="steel">スティール</button>
</div>
<input id="search" type="search" placeholder="カード番号・カード名で検索">
<div id="status">ログインするとPC・iPad間で枚数を共有できます。</div>
</header>
<div id="cards"></div>
<div id="printTableWrap" aria-hidden="true"></div>
<div id="resetPasswordPanel" role="dialog" aria-modal="true" aria-label="パスワード再設定">
 <div class="reset-box">
  <h2>新しいパスワードを設定</h2>
  <p style="font-size:13px;color:#cbd5ee">メールのリンクを開いたら、新しいパスワードを2回入力してください。</p>
  <input id="newPassword" type="password" autocomplete="new-password" placeholder="新しいパスワード（6文字以上）">
  <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="新しいパスワード（確認）">
  <button id="updatePassword" class="primary" style="width:100%">パスワードを更新</button>
  <button id="cancelPasswordReset" style="width:100%">戻る</button>
  <div id="resetStatus" role="status" style="font-size:12px;color:#cbd5ee;margin-top:8px"></div>
 </div>
</div>
<div id="inputScreen" role="dialog" aria-modal="true" aria-label="枚数入力">
 <div class="input-panel">
  <div class="input-head"><h2>枚数入力</h2><button id="closeInput">閉じる</button></div>
  <div class="input-name" id="inputCardName"></div>
  <div class="counter"><label>N 通常</label><button class="minus" id="nMinus">−</button><div class="count-value active" id="nValue">0</div><button class="plus" id="nPlus">＋</button></div>
  <div class="counter"><label class="f">F フォイル</label><button class="minus" id="fMinus">−</button><div class="count-value" id="fValue">0</div><button class="plus" id="fPlus">＋</button></div>
  <div class="hint">数字を選んでテンキー入力、または＋・−で変更できます。変更内容は自動保存されます。</div>
  <div class="keypad" id="keypad"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button class="utility" data-key="clear">クリア</button><button data-key="0">0</button><button class="utility" data-key="back">⌫</button></div>
  <div class="keyboard-hint">PC：数字キーで入力／Backspaceで1桁削除／←→ボタンで前後のカードへ</div>
  <div class="input-actions"><button id="prevCard" class="nav-button">← 前のカード</button><button id="inputDone" class="primary">入力完了</button><button id="nextCard" class="nav-button">次のカード →</button></div>
 </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const SUPABASE_URL = "https://znmsbvbtcbtgzgtljxzc.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_yb9oh1nKNgb6uFeN_pPf2Q_kQksgoK6";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
 auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "implicit" }
});
let user = null, cards = [], counts = new Map(), visibleCards = [];
const HIGH_RARITIES = new Set(["エピック", "エンチャンテッド", "アイコニック"]);
const highMode = new URLSearchParams(location.search).get("high") === "1";
if (highMode) document.body.classList.add("high-only");
const $ = id => document.getElementById(id);
function norm(v) { return String(v ?? "").normalize("NFKC").toLowerCase().replace(/[\s\-_]/g,""); }
const INK_COLORS = {
 amber:{label:"アンバー",hex:"#FFE48F",aliases:["amber","アンバー","黄","黄色"]},
 amethyst:{label:"アメジスト",hex:"#C7A1E3",aliases:["amethyst","アメジスト","紫"]},
 emerald:{label:"エメラルド",hex:"#9BFFC8",aliases:["emerald","エメラルド","緑"]},
 ruby:{label:"ルビー",hex:"#FFA7A7",aliases:["ruby","ルビー","赤"]},
 sapphire:{label:"サファイア",hex:"#B9EDFF",aliases:["sapphire","サファイア","青"]},
 steel:{label:"スティール",hex:"#CDCDCD",aliases:["steel","スティール","スチール","灰","グレー"]}

function getCardInks(c) {
 const raw = [];
 if (Array.isArray(c.colors)) raw.push(...c.colors);
 else if (c.colors != null) raw.push(c.colors);
 [c.color, c.color1, c.color2, c.ink, c.ink1, c.ink2].forEach(v=>{if(v!=null && String(v).trim()!=="")raw.push(v)});
 const found=[];
 for (const value of raw) {
  const t=norm(value);
  for (const [key,info] of Object.entries(INK_COLORS)) {
   if (info.aliases.some(a=>norm(a)===t) || t.includes(key) || info.aliases.some(a=>t.includes(norm(a)))) {
    if(!found.includes(key))found.push(key);
   }
  }
 }
 // 古い cardMaster.json に色2の情報がなくても、既知のデュアルインク一覧で補完
 if(found.length < 2) {
  const rawCode=String(c.code||"").toLowerCase();
  const codeMatch=rawCode.match(/^ja0*(\d+)[-_]0*(\d+)/i);
  const fallbackKey=codeMatch ? `ja${Number(codeMatch[1])}-${String(Number(codeMatch[2])).padStart(3,"0")}` : rawCode;
  const fallback=DUAL_INK_FALLBACK[fallbackKey] || DUAL_INK_FALLBACK[rawCode];
  if(fallback) for(const value of fallback) {
   const t=norm(value);
   for(const [key,info] of Object.entries(INK_COLORS)) {
    if(info.aliases.some(a=>norm(a)===t) || t.includes(key) || info.aliases.some(a=>t.includes(norm(a)))) {
     if(!found.includes(key))found.push(key);
    }
   }
  }
 }
 return found;
}

 if (inks.length === 1) return INK_COLORS[inks[0]].hex;
 return "";
}

});

 if(event==="PASSWORD_RECOVERY") showPasswordReset();
 if(event==="SIGNED_IN" && session?.user){user=session.user;authUI();}
});
checkPasswordRecoveryUrl();
$("logout").addEventListener("click",async()=>{await sb.auth.signOut();user=null;counts=new Map();authUI();render();closeInput();$("status").textContent="ログアウトしました。";});
function escapePrint(value){return String(value??"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));}
function buildPrintTable(){
 const wrap=$("printTableWrap");
 const rarityClass={"レア":"rare","スーパーレア":"super","レジェンダリー":"legendary","エピック":"epic","エンチャンテッド":"enchanted","アイコニック":"iconic"};
 const cardsHtml=[];
 for(const c of visibleCards){
  const inks=getCardInks(c),v=counts.get(String(c.code))||{n:Number(c.normal||0),f:Number(c.foil||0)};
  const code=escapePrint(c.code);
  const first=inks[0]&&INK_COLORS[inks[0]]?INK_COLORS[inks[0]].hex:"#fff";
  const second=inks[1]&&INK_COLORS[inks[1]]?INK_COLORS[inks[1]].hex:first;
  const chip=inks.length>=2
   ? `<span class="print-code dual-chip" style="--ink1:${first};--ink2:${second}">${code}</span>`
   : `<span class="print-code" style="background:${first}">${code}</span>`;
  const cls=rarityClass[c.rarity];
  const mark=cls?`<span class="rarity ${cls} print-rarity" aria-label="${escapePrint(c.rarity)}"></span>`:"";
  cardsHtml.push(`<div class="print-cell">${chip}${mark}<span class="print-counts"><span>N ${v.n}</span><span>F ${v.f}</span></span></div>`);
 }
 // A4縦1ページ用：7列×30行（最大210枚）。grid-auto-flow:columnにより、30枚を上から下へ並べて右列へ進む。
 wrap.innerHTML=`<div id="printTitle">LORCANA　コレクション一覧</div><div id="printGrid">${cardsHtml.join("")}</div>`;
}
$("printButton").addEventListener("click",()=>{buildPrintTable();window.print();});
$("back").addEventListener("click",()=>location.href="./index.html");
$("highButton").addEventListener("click",()=>location.href=highMode?"./collection.html":"./collection.html?high=1");
document.querySelectorAll(".ink-filter").forEach(b=>b.addEventListener("click",()=>{selectedInk=b.dataset.ink;updateInkButtons();render();}));
$("search").addEventListener("input",render);$("set").addEventListener("change",render);$("ownership").addEventListener("change",render);
(async()=>{
 try {
  const {data}=await sb.auth.getSession();user=data.session?.user||null;authUI();
  await loadCards();
  if(user) await loadCounts();
 } catch(e) {$("status").textContent="読み込みエラー："+e.message;}
})();
</script>
