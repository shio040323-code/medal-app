<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>スーベニアメダル管理</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: sans-serif;
  margin: 10px;
}

input {
  max-width: 100px;
  padding: 10px;
  font-size: 16px;
  margin-bottom: 4px;
  width: 80%;
  max-width: 300px;
  }

button {
  display: block;
  margin: 5px 0;
}
#typeFilters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 0;
  padding: 0;
}

#typeFilters label {
  display: flex;
  align-items: center;
  white-space: nowrap;
  margin: 0;
}

.grid {
  display: flex;
  flex-wrap: wrap;
}

.card {
  width: 180px;
  margin: 10px;
}

img {
  width: 100%;
  height: 120px;
  object-fit: contain;
  background: #f5f5f5;
  border-radius: 10px;
  padding: 5px;
}

.name {
  font-size: 12px;
}

.location {
  font-size: 12px;
  color: gray;
}

.date {
  font-size: 11px;
  color: #999;
}

.type {
  font-size: 12px;
  color: #999;
}

.detail {
  font-size: 12px;
}
</style>
</head>

<body>

<input type="text" id="search" placeholder="検索（名前・場所・ID）">
<button onclick="checkMissing()" style="display:block; margin-top:10px; background:red; color:white;">
欠番チェック
</button>
<div id="typeFilters"></div>

<div class="grid" id="grid"></div>

<script>
let data = []

// データ読み込み
fetch("data.json?v=" + Date.now())
  .then(res => res.json())
  .then(json => {
    data = json
    setupFilter()
    applyFilter()
  })

// 検索イベント
document.getElementById("search").addEventListener("input", applyFilter)


// チェックボックス生成
function setupFilter() {
  const container = document.getElementById("typeFilters")
  container.innerHTML = ""

  const types = [...new Set(data.map(item => item.type))]

  types.forEach(type => {
    const label = document.createElement("label")
    label.style.marginRight = "10px"

    const cb = document.createElement("input")
    cb.type = "checkbox"
    cb.value = type
    cb.checked = true

    cb.addEventListener("change", applyFilter)

    label.appendChild(cb)
    label.appendChild(document.createTextNode(" " + type))

    container.appendChild(label)
  })
}


// フィルター本体
function applyFilter() {
  const q = document.getElementById("search").value.toLowerCase()

  const checkedTypes = [...document.querySelectorAll("#typeFilters input:checked")]
    .map(cb => cb.value)

  const filtered = data.filter(item => {

    const matchText =
      item.name.toLowerCase().includes(q) ||
      item.location.toLowerCase().includes(q) ||
      item.id.toLowerCase().includes(q)

    // ★ここが重要（チェック0個＝全部表示）
    const matchType =
      checkedTypes.length === 0
        ? true
        : checkedTypes.includes(item.type)

    return matchText && matchType
  })

  render(filtered)
}


// 表示
function render(list){
  const grid = document.getElementById("grid")
  grid.innerHTML = ""

  list.forEach(item => {

    const imgId = item.id.split("-").pop()

    const div = document.createElement("div")
    div.className = "card"

    div.innerHTML = `
      <img src="images/${imgId}.png">
      <div><b>${item.id}</b> / <span class="type">${item.type}</span></div>
      <div class="detail">${item.detail || ""}</div>
      <div class="date">${item.date}</div>
      <div class="location">${item.location}</div>
      <div class="name">${item.name}</div>
    `

    grid.appendChild(div)
  })
function checkMissing() {

  if (!data || data.length === 0) {
    alert("データがまだ読み込まれていません")
    return
  }

  const numbers = data
    .map(item => parseInt(item.id.replace(/\D/g, "")))
    .filter(n => !isNaN(n))

  numbers.sort((a, b) => a - b)

  let missing = []

  const start = numbers[0]
  const end = numbers[numbers.length - 1]

  for (let n = start; n <= end; n++) {
    if (!numbers.includes(n)) {
      missing.push(n)
    }
  }

  alert(
    missing.length
      ? "欠番:\n" + missing.map(n => n.toString().padStart(4, "0")).join(", ")
      : "欠番なし"
  )
}
}
</script>

</body>
</html>
