<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<title>スーベニアメダル管理</title>

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>

body {
  font-family: sans-serif;
  margin: 10px;
}


input {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  margin-bottom: 10px;
}

.grid {
  display: flex;
  flex-wrap: wrap;
}

.card {
  width: 180px;
  margin: 10px;
}
img {
  width: 100%;
  height: 120px;
  object-fit: contain;
  background: #f5f5f5;
  border-radius: 10px;
  padding: 5px;
}

.name {
  font-size: 12px;
  margin-top: 0px;
   color: gray;
}

.location {
  font-size: 12px;
  color: rgb(4, 4, 4);
  margin-bottom: 0px;
}
.date {
  font-size: 11px;
  color: #999;
}
.type {
  font-size: 12px;
  color: #999;
}
.detail {
  font-size: 12px;
  color: #000000;
}
</style>

</head>

<body>


<input type="text" id="search" placeholder="検索（名前・場所）">
<button onclick="checkMissing()">欠番チェック</button>
<div class="grid" id="grid"></div>
<script>
let data = []   // ← これ追加（外に出す）
fetch("data.json")
  .then(res => res.json())
  .then(data => {
    data = json   // ← ここで代入
    render(data)
  })

// ここで表示
render(data)

function render(list){
  const grid = document.getElementById("grid")
  grid.innerHTML = ""

  list.forEach(item => {
    const div = document.createElement("div")
    div.className = "card"

    div.innerHTML = `
      <img src="images/${item.id.replace(/^[A-Z]-/, '')}.png">
      <div><b>${item.id}</b>/<span class="type">${item.type}</span></div>
      <div class="detail">${item.detail || ""}</div>
      <div class="date">${item.date}</div>
      <div class="location">${item.location}</div>
      <div class="name">${item.name}</div>
    `

    grid.appendChild(div)
  })
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
}
function checkMissing() {
  // IDから数字だけ取り出し
  const numbers = data.map(item =>
    parseInt(item.id.split('-')[1])
  )

  // 昇順に並べる
  numbers.sort((a, b) => a - b)

  let missing = []

  for (let i = 0; i < numbers.length - 1; i++) {
    let current = numbers[i]
    let next = numbers[i + 1]

    // 間が空いてたら全部追加
    for (let n = current + 1; n < next; n++) {
      missing.push(n)
    }
  }

  // 表示
  if (missing.length === 0) {
    alert("欠番なし 👍")
  } else {
    alert("欠番:\n" + missing.join(", "))
  }
}
</script>


</body>
</html>
