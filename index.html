<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>スーベニアメダル管理</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: sans-serif;
  margin: 10px;
}

input {
  max-width: 100px;
  padding: 10px;
  font-size: 16px;
  margin-bottom: 4px;
  width: 80%;
  max-width: 300px;
  }

button {
  display: block;
  margin: 5px 0;
}
.grid {
  display: flex;
  flex-wrap: wrap;
}

.card {
  width: 180px;
  margin: 10px;
}

img {
  width: 100%;
  height: 120px;
  object-fit: contain;
  background: #f5f5f5;
  border-radius: 10px;
  padding: 5px;
}

.name {
  font-size: 12px;
}

.location {
  font-size: 12px;
  color: gray;
}

.date {
  font-size: 11px;
  color: #999;
}

.type {
  font-size: 12px;
  color: #999;
}

.detail {
  font-size: 12px;
}
.filters {
  display: flex;
  flex-wrap: nowrap;

  gap: 8px;

  overflow-x: auto;

  padding-bottom: 4px;
}

.filters label {
  display: flex;
  align-items: center;
  gap: 4px;

  padding: 6px 30px;

  background: #f3f3f3;
  border-radius: 999px;

  font-size: 15px;

  cursor: pointer;

  user-select: none;

  transition: 0.2s;
}

.filters label:hover {
  background: #e0e0e0;
}

.filters input[type="checkbox"] {
  margin: 0;
}
.topbar {
  position: sticky;
  top: 0;

  background: white;

  z-index: 999;

  padding: 10px 0;

  border-bottom: 1px solid #ddd;
}
</style>
</head>

<body>
<div class="topbar">
<input type="text" id="search" placeholder="検索（番号・名前・場所・詳細・ID）">
<button id="missingBtn">欠番</button>
<button onclick="clearFilters()">□</button>
<div id="typeFilters" class="filters"></div>
<select id="locationSelect">
  <option value="">すべての場所</option>
</select>
</div>
<div class="grid" id="grid"></div>

<script>
let data = []

// データ読み込み
fetch("data.json")
  .then(res => res.json())
  .then(json => {
    data = json
    setupFilter()
    createLocationSelect()
    applyFilter()
  })

// 検索イベント
document.getElementById("search").addEventListener("input", applyFilter)


// チェックボックス生成
function setupFilter() {
  const container = document.getElementById("typeFilters")
  container.innerHTML = ""

  const types = [...new Set(data.map(item => item.type))]

  types.forEach(type => {
    const label = document.createElement("label")
    label.style.marginRight = "10px"

    const cb = document.createElement("input")
    cb.type = "checkbox"
    cb.value = type
    cb.checked = true

    cb.addEventListener("change", applyFilter)

    label.appendChild(cb)
    label.appendChild(document.createTextNode(" " + type))

    container.appendChild(label)
  })
}
function createLocationSelect() {

  const select =
    document.getElementById("locationSelect")

  // 重複なしlocation一覧
  const locations = [
    ...new Set(data.map(item => item.location))
  ]

  // option追加
  locations.forEach(location => {

    const option = document.createElement("option")

    option.value = location
    option.textContent = location

    select.appendChild(option)
  })

  // 選択変更時
  select.addEventListener("change", applyFilter)
}
function applyFilter() {

  const keyword = normalize(
    document.getElementById("search").value
  )

  // typeチェック
  const checkedTypes = [
    ...document.querySelectorAll("#typeFilters input:checked")
  ].map(cb => cb.value)

  // locationチェック
  const selectedLocation = 
  document.getElementById("locationSelect").value


  const filtered = data.filter(item => {

    const matchKeyword =

      normalize(item.id).includes(keyword) ||
      normalize(item.name).includes(keyword) ||
      normalize(item.location).includes(keyword) ||
      normalize(item.type).includes(keyword) ||
      normalize(item.detail).includes(keyword)

    const matchType =
      checkedTypes.length === 0
        ? true
        : checkedTypes.includes(item.type)

    const matchLocation =
  selectedLocation === ""
    ? true
    : item.location === selectedLocation

    return matchKeyword && matchType && matchLocation
  })

  render(filtered)
}

function render(list){
  const grid = document.getElementById("grid")
  grid.innerHTML = ""

  list.forEach(item => {

    const imgId = item.id.split("-").pop()

    const div = document.createElement("div")
    div.className = "card"

    div.innerHTML = `
  <img
  loading="lazy"
  src="images/${imgId}.png"
  onerror="this.src='noimage.png'"
  >
  <div><b>${item.id}</b> / <span class="type">${item.type}</span></div>
  <div class="detail">${item.detail || ""}</div>
  <div class="date">${item.date}</div>
  <div class="location">${item.location}</div>
  <div class="name">${item.name}</div>

    `

    grid.appendChild(div)
  })
}
function normalize(text) {
  return (text || "")
    .toString()
    .normalize("NFKC")      // 半角→全角統一
    .toLowerCase()          // 小文字化
    .replace(/\s/g, "")     // 半角/全角スペース削除
    .replace(/-/g, "")      // ハイフン削除
}
function clearFilters() {

  // type全部OFF
  document
    .querySelectorAll("#typeFilters input")
    .forEach(cb => cb.checked = false)

  // location初期化
  document.getElementById("locationSelect").value = ""

  applyFilter()
}


function checkMissing() {

  if (!data || data.length === 0) {
    alert("データがまだ読み込まれていません")
    return
  }

  const nums = data
    .map(item => parseInt(item.id.match(/\d+/)?.[0]))
    .filter(n => !isNaN(n))

  const set = new Set(nums)

  const min = Math.min(...nums)
  const max = Math.max(...nums)

  let missing = []

  for (let n = min; n <= max; n++) {
    if (!set.has(n)) missing.push(n)
  }

  alert(
    missing.length
      ? "欠番:\n" + missing.map(n => String(n).padStart(4, "0")).join(", ")
      : "欠番なし"
  )
}
document.getElementById("missingBtn")
  .addEventListener("click", checkMissing);

</script>

</body>
</html>
