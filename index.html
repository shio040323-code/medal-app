let data = []

let imageFolder = "images"

// データ読み込み
async function loadData() {
  try {
    const response = await fetch("./data.json", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(`data.json読み込みエラー: ${response.status}`);
    }

    masterData = await response.json();

    // iPad内に保存した追加データを読み込む
    addedData = await loadAddedData();

    // GitHubのdata.jsonを優先して合体
    data = mergeData(masterData, addedData);

    setupFilter();
    createLocationSelect();

    filteredData = data;

    currentPage = Math.max(
      1,
      Math.min(
        parseInt(localStorage.getItem("currentPage")) || 1,
        Math.max(1, Math.ceil(filteredData.length / pageSize))
      )
    );

    renderPage();
    setupSimulatorRoman();
    cacheImages(data);

    console.log("GitHubのdata.json + iPad追加データを読み込みました");
  } catch (error) {
    console.error("data.jsonの読み込みに失敗しました", error);

    // オフライン時はiPad保存分だけでも表示
    try {
      addedData = await loadAddedData();
      data = mergeData([], addedData);
      setupFilter();
      createLocationSelect();
      filteredData = data;
      renderPage();
      setupSimulatorRoman();
    } catch (e) {
      console.error("iPad保存データの読み込みにも失敗しました", e);
    }
  }
}

// 管理番号の数字だけを取り出す
// L-0001 / S-0001 / H-0001 / LS-0001 → 1
function getNumberOnly(id) {
  const match = String(id || "").match(/\d+/);
  return match ? String(Number(match[0])) : "";
}

// GitHub側を優先してデータを合体
function mergeData(master, additions) {
  const result = Array.isArray(master) ? [...master] : [];

  const masterNumbers = new Set(
    result
      .map(item => getNumberOnly(item.id))
      .filter(Boolean)
  );

  (Array.isArray(additions) ? additions : []).forEach(item => {
    const num = getNumberOnly(item.id);

    // 同じ数字がGitHubにあればGitHub側を使用
    if (num && masterNumbers.has(num)) return;

    result.push(item);
  });

  return result;
}

// =========================
// iPad内データ保存 IndexedDB
// =========================
const ADD_DB_NAME = "medalAppDB";
const ADD_STORE_NAME = "addedData";
const ADD_DB_VERSION = 1;

function openAddedDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(ADD_DB_NAME, ADD_DB_VERSION);

    request.onupgradeneeded = event => {
      const db = event.target.result;

      if (!db.objectStoreNames.contains(ADD_STORE_NAME)) {
        db.createObjectStore(ADD_STORE_NAME, { keyPath: "id" });
      }
    };

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function loadAddedData() {
  return openAddedDB().then(db => {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(ADD_STORE_NAME, "readonly");
      const request = tx.objectStore(ADD_STORE_NAME).getAll();

      request.onsuccess = () => {
        resolve((request.result || []).map(item => ({ ...item, _local: true })));
        db.close();
      };

      request.onerror = () => {
        reject(request.error);
        db.close();
      };
    });
  });
}

function saveAddedData(item) {
  return openAddedDB().then(db => {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(ADD_STORE_NAME, "readwrite");
      tx.objectStore(ADD_STORE_NAME).put(item);

      tx.oncomplete = () => {
        db.close();
        resolve();
      };

      tx.onerror = () => {
        db.close();
        reject(tx.error);
      };
    });
  });
}

// 検索イベント
document.getElementById("search").addEventListener("input", applyFilter)


// チェックボックス生成
function setupFilter() {
  const container = document.getElementById("typeFilters")
  container.innerHTML = ""

  const types = [...new Set(data.map(item => item.type))]

  types.forEach(type => {
    const label = document.createElement("label")
    label.style.marginRight = "10px"

    const cb = document.createElement("input")
    cb.type = "checkbox"
    cb.value = type
    cb.checked = true

    cb.addEventListener("change", applyFilter)

    label.appendChild(cb)
    label.appendChild(document.createTextNode(" " + type))

    container.appendChild(label)
  })
}
function createLocationSelect() {

  const locationSelect =
    document.getElementById("locationSelect")

  const nameSelect =
    document.getElementById("nameSelect")

  // エリアを初期化
  locationSelect.innerHTML =
    `<option value="">すべて</option>`

  // 今まで通りグループ分け
  for (const groupName in locationGroups) {

    const optgroup =
      document.createElement("optgroup")

    optgroup.label = groupName

    locationGroups[groupName]
      .forEach(location => {

        const option =
          document.createElement("option")

        option.value = location
        option.textContent = location

        optgroup.appendChild(option)
      })

    locationSelect.appendChild(optgroup)
  }


  // エリアが変更されたとき
  locationSelect.addEventListener(
    "change",
    () => {

      createNameSelect()

      applyFilter()
    }
  )


  // 店舗が変更されたとき
  nameSelect.onchange = applyFilter


  // 最初の店舗一覧を作る
  createNameSelect()
}
function createNameSelect() {

  const locationSelect =
    document.getElementById("locationSelect")

  const nameSelect =
    document.getElementById("nameSelect")

  const selectedLocation =
    locationSelect.value


  // 店舗プルダウンを初期化
  nameSelect.innerHTML =
    `<option value="">すべて</option>`


  // 選択されたエリアのデータだけ取得
  let targetData = data

  if (selectedLocation !== "") {

    targetData =
      data.filter(item =>
        item.location === selectedLocation
      )
  }


  // nameだけ取り出して重複削除
  const names = [
    ...new Set(
      targetData
        .map(item => item.name)
        .filter(name => name)
    )
  ]


  // 名前順
  names.sort()


  // 店舗プルダウン作成
  names.forEach(name => {

    const option =
      document.createElement("option")

    option.value = name
    option.textContent = name

    nameSelect.appendChild(option)
  })
}

function applyFilter() {

  const keyword = normalize(
    document.getElementById("search").value
  )

  // typeチェック
  const checkedTypes = [
    ...document.querySelectorAll("#typeFilters input:checked")
  ].map(cb => cb.value)

  // locationチェック
  const selectedLocation = 
  document.getElementById("locationSelect").value
  const selectedName =
  document.getElementById("nameSelect").value


  const filtered = data.filter(item => {

    const matchKeyword =

      normalize(item.id).includes(keyword) ||
      normalize(item.name).includes(keyword) ||
      normalize(item.location).includes(keyword) ||
      normalize(item.type).includes(keyword) ||
      normalize(item.detail).includes(keyword) ||
      normalize(String(item.bookNum || "")).includes(keyword) ||
      normalize(toRoman(item.bookNum || 0)).includes(keyword)

    const matchType =
      checkedTypes.length === 0
        ? true
        : checkedTypes.includes(item.type)

    const matchLocation =
  selectedLocation === ""
    ? true
    : item.location === selectedLocation
    const matchName =
  selectedName === ""
    ? true
    : item.name === selectedName

    return (
  matchKeyword &&
  matchType &&
  matchLocation &&
  matchName
)
  })

filteredData = filtered;

const savedPage =
  parseInt(localStorage.getItem("currentPage")) || 1;

const totalPages =
  Math.max(
    1,
    Math.ceil(filteredData.length / pageSize)
  );

currentPage =
  Math.min(savedPage, totalPages);

renderPage();

}

function normalize(text) {
  return (text || "")
    .toString()
    .normalize("NFKC")      // 半角→全角統一
    .toLowerCase()          // 小文字化
    .replace(/\s/g, "")     // 半角/全角スペース削除
    .replace(/-/g, "")      // ハイフン削除
}
function toRoman(num) {

  if (!num) return ""

  const roman = [
    ["M",1000],
    ["CM",900],
    ["D",500],
    ["CD",400],
    ["C",100],
    ["XC",90],
    ["L",50],
    ["XL",40],
    ["X",10],
    ["IX",9],
    ["V",5],
    ["IV",4],
    ["I",1]
  ]

  let result = ""

  for (const [letter, value] of roman) {

    while (num >= value) {
      result += letter
      num -= value
    }
  }

  return result
}

function checkMissing() {

  if (!data || data.length === 0) {
    alert("データがまだ読み込まれていません")
    return
  }

  const nums = data
    .map(item => parseInt(item.id.match(/\d+/)?.[0]))
    .filter(n => !isNaN(n))

  const set = new Set(nums)

  const min = Math.min(...nums)
  const max = Math.max(...nums)

  let missing = []

  for (let n = min; n <= max; n++) {
    if (!set.has(n)) missing.push(n)
  }

  alert(
    missing.length
      ? "欠番:\n" + missing.map(n => String(n).padStart(4, "0")).join(", ")
      : "欠番なし"
  )
}

/* =========================
   iPad用 配置シミュレーター
   VBA版の機能をJavaScriptへ移植
   ========================= */
const simState = {
  faces: 3,
  books: 1,
  items: [],
  bookItems: [],
  drag: null
};

function romanToNumber(text) {
  const values = {I:1, V:5, X:10, L:50, C:100, D:500, M:1000};
  let total = 0;
  text = String(text || "").toUpperCase().trim();
  for (let i = 0; i < text.length; i++) {
    const cur = values[text[i]] || 0;
    const next = i + 1 < text.length ? (values[text[i+1]] || 0) : 0;
    total += cur < next ? -cur : cur;
  }
  return total;
}

function extractNumber(text) {
  const m = String(text || "").match(/\d+/);
  return m ? Number(m[0]) : -1;
}

function setupSimulatorRoman() {
  const select = document.getElementById("simRoman");
  if (!select || !Array.isArray(data)) return;

  const romans = [...new Set(
    data.map(item => String(item.bookNum || "").trim()).filter(Boolean)
  )];

  // bookNo.は大きい番号から小さい番号へ降順
  romans.sort((a, b) => {
    const na = romanToNumber(a);
    const nb = romanToNumber(b);
    return nb - na;
  });

  select.innerHTML = '<option value="">すべて</option>';
  romans.forEach(roman => {
    const option = document.createElement("option");
    option.value = roman;
    option.textContent = roman;
    select.appendChild(option);
  });
}

function makeSimulatorList() {
  const start = Number(document.getElementById("simStart").value || 1);
  const end = Number(document.getElementById("simEnd").value || 45);
  const roman = document.getElementById("simRoman").value;

  if (start > end) {
    alert("開始番号が終了番号より大きくなっています。");
    return [];
  }

  return data.filter(item => {
    const num = extractNumber(item.id);
    if (roman === "") {
      return num >= start && num <= end;
    }
    return String(item.bookNum || "").trim() === roman;
  });
}

function simItemText(item) {
  if (!item) return "";
  return [
    item.id || "",
    item.type || "",
    item.detail || ""
  ].filter(Boolean).join("\n");
}

function buildSimulatorBooks() {
  const base = makeSimulatorList();

  // 1book：選択した既存データを配置候補にする
  // 2book：最初は完全に空。ここへシミュレーター上だけで追加する。
  simState.bookItems = [];
  simState.bookItems.push(base.slice());

  for (let book = 1; book < simState.books; book++) {
    simState.bookItems.push([]);
  }

  // 旧コードとの互換用
  simState.items = simState.bookItems[0];
}

function renderSimulator() {
  const area = document.getElementById("simFacesArea");
  if (!area) return;

  area.innerHTML = "";

  const slotsPerFace = 15;
  const bookItems = Array.isArray(simState.bookItems) ? simState.bookItems : [];

  for (let book = 0; book < simState.books; book++) {
    const bookBox = document.createElement("div");
    bookBox.className = "sim-book";

    const bookTitle = document.createElement("div");
    bookTitle.className = "sim-book-title";
    bookTitle.textContent = `${book + 1}book`;
    bookBox.appendChild(bookTitle);

    const currentBook = bookItems[book] || [];

    for (let face = 0; face < simState.faces; face++) {
      const faceBox = document.createElement("div");
      faceBox.className = "sim-face";

      const title = document.createElement("div");
      title.className = "sim-face-title";
      title.textContent = `${face + 1}面`;
      faceBox.appendChild(title);

      const grid = document.createElement("div");
      grid.className = "sim-grid";

      for (let slot = 0; slot < slotsPerFace; slot++) {
        const index = face * slotsPerFace + slot;
        const item = currentBook[index] || null;

        const cell = document.createElement("div");
        cell.className = "sim-slot" + (item ? "" : " empty");
        if (item?._local) cell.classList.add("local-data");

        cell.dataset.book = String(book);
        cell.dataset.face = String(face);
        cell.dataset.slot = String(slot);
        cell.textContent = item ? simItemText(item) : "";

        if (!item) {
          cell.addEventListener("click", () => {
            // 空きマスへのiPad追加は、このbookのこの位置に入れる
            openAddDataModal(index, false, book);
          });
        } else {
          cell.addEventListener("pointerdown", e => {
            if (e.pointerType === "mouse" && e.button !== 0) return;
            simState.drag = {
              book,
              index,
              pointerId: e.pointerId,
              startX: e.clientX,
              startY: e.clientY
            };
            cell.setPointerCapture?.(e.pointerId);
            cell.style.opacity = "0.55";
          });

          cell.addEventListener("pointerup", e => {
            const drag = simState.drag;
            if (!drag || drag.pointerId !== e.pointerId) return;
            cell.style.opacity = "";

            const dx = e.clientX - drag.startX;
            const dy = e.clientY - drag.startY;
            const moved = Math.sqrt(dx * dx + dy * dy) > 12;

            if (!moved) {
              if (item._local) {
                openAddDataModal(index, true, book);
              }
              simState.drag = null;
              return;
            }

            const target = document.elementFromPoint(e.clientX, e.clientY);
            const targetCell = target?.closest?.(".sim-slot");

            if (targetCell && targetCell !== cell) {
              const targetBook = Number(targetCell.dataset.book || 0);
              const targetIndex =
                Number(targetCell.dataset.face) * slotsPerFace +
                Number(targetCell.dataset.slot);

              if (targetBook === book) {
                [currentBook[index], currentBook[targetIndex]] =
                  [currentBook[targetIndex], currentBook[index]];
                renderSimulator();
              }
            }

            simState.drag = null;
          });

          cell.addEventListener("pointercancel", () => {
            cell.style.opacity = "";
            simState.drag = null;
          });
        }

        grid.appendChild(cell);
      }

      faceBox.appendChild(grid);
      bookBox.appendChild(faceBox);
    }

    area.appendChild(bookBox);
  }
}

function openSimulator() {
  document.getElementById("simulator").style.display = "block";
  setupSimulatorRoman();
  simState.faces = Number(document.getElementById("simFaces").value || 3);
  simState.books = Number(document.getElementById("simBooks")?.value || 1);
  buildSimulatorBooks();
  renderSimulator();
}

function closeSimulator() {
  document.getElementById("simulator").style.display = "none";
  simState.drag = null;
}

document.getElementById("simulatorBtn").addEventListener("click", openSimulator);
document.getElementById("simClose").addEventListener("click", closeSimulator);

document.getElementById("simFaces").addEventListener("change", () => {
  simState.faces = Number(document.getElementById("simFaces").value);
  renderSimulator();
});

document.getElementById("simRoman").addEventListener("change", () => {
  buildSimulatorBooks();
  renderSimulator();
});

document.getElementById("simBooks").addEventListener("change", () => {
  simState.books = Number(document.getElementById("simBooks").value || 1);
  buildSimulatorBooks();
  renderSimulator();
});

document.getElementById("simDisplay").addEventListener("click", () => {
  buildSimulatorBooks();
  renderSimulator();
});

function openAddDataModal(index, editMode = false, bookIndex = 0) {
  const modal = document.getElementById("addDataModal");
  if (!modal) return;

  const bookItems = simState.bookItems[bookIndex] || [];
  const item = editMode ? (bookItems[index] || null) : null;

  setupAddTypeSelect();

  const prefix = document.getElementById("addIdPrefix");
  const number = document.getElementById("addIdNumber");
  const type = document.getElementById("addType");
  const detail = document.getElementById("addDetail");
  const deleteButton = document.getElementById("addDataDelete");
  const saveButton = document.getElementById("addDataSave");
  const message = document.getElementById("addDataMessage");
  const title = document.getElementById("addDataTitle");

  if (message) message.textContent = "";

  if (item) {
    const m = String(item.id || "").match(/^([A-Za-z]+)-(\d+)$/);
    prefix.value = m?.[1] || "L";
    number.value = m?.[2] || "";
    type.value = item.type || "";
    detail.value = item.detail || "";
    deleteButton.style.display = "none";
    saveButton.textContent = "更新";
    title.textContent = `${bookIndex + 1}book データ`;
  } else {
    prefix.value = "L";
    number.value = "";
    type.value = "";
    detail.value = "";
    deleteButton.style.display = "none";
    saveButton.textContent = "このマスに追加";
    title.textContent = `${bookIndex + 1}book にメダルを追加`;
  }

  modal.dataset.simIndex = String(index);
  modal.dataset.simBook = String(bookIndex);
  modal.dataset.editMode = editMode ? "1" : "0";
  modal.style.display = "block";

  if (!editMode) setTimeout(() => number.focus(), 50);
}

function closeAddDataModal() {
  const modal = document.getElementById("addDataModal");
  if (!modal) return;

  modal.style.display = "none";
  modal.dataset.simIndex = "-1";
  modal.dataset.editMode = "0";
}

async function addSimulatorData() {
  const modal = document.getElementById("addDataModal");
  const index = Number(modal.dataset.simIndex);
  const bookIndex = Number(modal.dataset.simBook || 0);
  const editMode = modal.dataset.editMode === "1";
  const bookItems = simState.bookItems[bookIndex] || (simState.bookItems[bookIndex] = []);

  const prefix = document.getElementById("addIdPrefix").value;
  const rawNumber = document.getElementById("addIdNumber").value
    .normalize("NFKC")
    .replace(/\D/g, "");
  const type = document.getElementById("addType").value.trim();
  const detail = document.getElementById("addDetail").value.trim();
  const message = document.getElementById("addDataMessage");

  if (!rawNumber) {
    message.textContent = "管理番号の数字を入力してください。";
    return;
  }
  if (!type) {
    message.textContent = "種類を選択してください。";
    return;
  }

  const id = `${prefix}-${rawNumber.padStart(4, "0")}`;

  // シミュレーターでは、同じメダルを別bookに配置してもOK。
  // これはデータの複製ではなく「配置先の記録」です。
  // 既存データがあれば、その情報を参照して配置します。
  const source = data.find(item => String(item.id).toUpperCase() === id.toUpperCase());
  const oldItem = editMode ? (bookItems[index] || null) : null;

  const item = {
    ...(source || {}),
    id,
    type: type || source?.type || "",
    detail: detail || source?.detail || "",
    _simOnly: true
  };

  if (oldItem) {
    // 編集時はこのbookの配置だけ更新
    bookItems[index] = item;
  } else {
    bookItems[index] = item;
  }

  // 2bookへの追加はdata.jsonやIndexedDBへ保存しない
  simState.items = simState.bookItems[0] || [];
  renderSimulator();
  closeAddDataModal();
}

async function deleteCurrentAddedData() {
  const modal = document.getElementById("addDataModal");
  const index = Number(modal.dataset.simIndex);
  const bookIndex = Number(modal.dataset.simBook || 0);
  const bookItems = simState.bookItems[bookIndex] || [];
  const item = bookItems[index];

  if (!item) return;
  if (!confirm(`「${item.id}」を${bookIndex + 1}bookから外しますか？`)) return;

  bookItems[index] = null;
  simState.items = simState.bookItems[0] || [];
  renderSimulator();
  closeAddDataModal();
}

async function clearAllAddedData() {
  if (!confirm("iPad内に保存されている追加データをすべて削除します。\nGitHubのdata.jsonは削除されません。\n実行しますか？")) return;
  try {
    const db = await openAddedDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(ADD_STORE_NAME, "readwrite");
      tx.objectStore(ADD_STORE_NAME).clear();
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error("transaction aborted"));
    });
    db.close();
    addedData = [];
    data = mergeData(masterData, addedData);
    simState.bookItems = (simState.bookItems || []).map((bookItems, bookIndex) =>
      bookIndex === 0 ? bookItems.map(item => item?._local ? null : item) : bookItems
    );
    simState.items = simState.bookItems[0] || [];
    setupFilter();
    createLocationSelect();
    filteredData = data;
    currentPage = 1;
    renderPage();
    setupSimulatorRoman();
    renderSimulator();
    closeAddDataModal();
    alert("iPad追加データをすべて削除しました。");
  } catch (error) {
    console.error("iPad追加データ全削除エラー:", error);
    alert("削除できませんでした。");
  }
}

document.getElementById("addDataCancel").onclick = closeAddDataModal;

async function cacheImages(data) {

  if (!("caches" in window)) return;

  const cache = await caches.open("medal-app-v5");

  const batchSize = 100;

  for (let i = 0; i < data.length; i += batchSize) {

    const batch = data.slice(i, i + batchSize);

    await Promise.all(

      batch.map(async item => {

        const imgId = item.id.split("-").pop();

        const url = `./images/${imgId}.webp`;

        try {

          const cached = await cache.match(url);

          if (!cached) {

            const response = await fetch(url);

            if (response.ok) {
              await cache.put(url, response.clone());
            }

          }

        } catch (e) {}

      })

    );

    console.log(
      `画像キャッシュ ${Math.min(i + batchSize, data.length)} / ${data.length}`
    );

    // iPadを休ませる
    await new Promise(resolve => setTimeout(resolve, 200));

  }

  console.log("全画像キャッシュ完了");

}
