<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>スーベニアメダル管理</title>

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="メダル管理">
<style>
body {
  font-family: sans-serif;
  margin: 10px;
}

input {
  max-width: 100px;
  padding: 10px;
  font-size: 16px;
  margin-bottom: 4px;
  width: 80%;
  max-width: 300px;
  }

button {
  margin: 5px 0;
}
.grid {
  display: flex;
  flex-wrap: wrap;
}

.card {
  width: 180px;
  margin: 2px;
  padding: 2px;
}

img {
  width: 100%;
  height: 120px;
  object-fit: contain;
  background: #f5f5f5;
  border-radius: 10px;
  padding: 1px;
}
img.noimage{
  background: transparent;
}
.id {
     font-size: 18px;
     font-weight: bold; 
    }
.name {
  font-size: 12px;
}

.location {
  font-size: 12px;
  color: gray;
}

.date {
  font-size: 11px;
  color: #999;
}

.type {
  font-size: 12px;
  color: #999;
}

.detail {
  font-size: 12px;
  font-weight: bold;
}
.filters {
  display: flex;
  flex-wrap: nowrap;

  gap: 8px;

  overflow-x: auto;

  padding-bottom: 4px;
}

.filters label {
  display: flex;
  align-items: center;
  gap: 4px;

  padding: 6px 30px;

  background: #f3f3f3;
  border-radius: 999px;

  font-size: 15px;

  cursor: pointer;

  user-select: none;

  transition: 0.2s;

  white-space: nowrap;

  flex: 0 0 auto;
}

.filters label:hover {
  background: #e0e0e0;
}

.filters input[type="checkbox"] {
  margin: 0;
}
.topbar {
  position: sticky;
  top: 0;

  background: white;

  z-index: 999;

  padding: 4px 0;

  border-bottom: 1px solid #ddd;
}
.book{
  margin-left: 6px;
  font-size: 12px;
  color: #999;
}
.legend {
  font-size: 12px;
  color: #666;
  padding: 3px 0;
  white-space: nowrap;
  overflow-x: auto;
}
/* =========================
   iPad mini 6 縦向き
   ========================= */
@media screen and (min-width: 700px) and (max-width: 800px) {

  body {
    margin: 6px;
  }

  .topbar {
    padding: 3px 0;
  }

  #search {
    width: 95% !important;
    max-width: none !important;
    box-sizing: border-box;
    padding: 10px !important;
    font-size: 16px !important;
  }

  #printIds {
    width: 100px !important;
    padding: 8px !important;
    font-size: 16px !important;
  }

  button {
    min-height: 40px;
    padding: 6px 10px;
    font-size: 15px;
    touch-action: manipulation;
  }

  #pageInput {
    width: 50px !important;
    height: 36px;
    padding: 4px !important;
    font-size: 16px !important;
    box-sizing: border-box;
    text-align: center;
  }

  .filters {
    gap: 6px;
    padding: 5px 0;
    -webkit-overflow-scrolling: touch;
  }

  .filters label {
    padding: 9px 14px;
    font-size: 15px;
  }

  .filters input[type="checkbox"] {
    width: 18px;
    height: 18px;
  }

  #locationSelect,
  #nameSelect {
    min-height: 40px;
    padding: 6px 10px;
    font-size: 15px;
    max-width: 48%;
  }

  /* ★ 3列表示 */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    width: 100%;
    box-sizing: border-box;
  }

  .card {
    width: auto;
    margin: 0;
    padding: 3px;
    box-sizing: border-box;
    min-width: 0;
  }

  .card img {
    width: 100%;
    height: 120px;
    object-fit: contain;
    box-sizing: border-box;
  }

  .id {
    font-size: 16px;
  }

  .name {
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .location {
    font-size: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .date,
  .type,
  .detail,
  .book {
    font-size: 10px;
  }
}

/* =========================
   配置シミュレーター
   ========================= */
#simulator {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 2000;
  background: rgba(0,0,0,.45);
  overflow: auto;
  padding: 10px;
  box-sizing: border-box;
}
#simulator .sim-panel {
  background: #fff;
  max-width: 760px;
  margin: 0 auto;
  border-radius: 12px;
  padding: 12px;
  box-sizing: border-box;
}
.sim-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.sim-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.sim-controls input,
.sim-controls select {
  min-height: 38px;
  box-sizing: border-box;
  font-size: 16px;
  padding: 5px 8px;
}
.sim-controls input[type="number"] { width: 75px; }
.sim-face {
  border: 1px solid #aaa;
  border-radius: 8px;
  padding: 8px;
  margin-top: 10px;
}
.sim-face-title {
  font-weight: bold;
  margin-bottom: 6px;
}
.sim-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
}
.sim-slot {
  min-height: 62px;
  border: 2px solid #888;
  border-radius: 6px;
  background: #fafafa;
  padding: 4px;
  box-sizing: border-box;
  text-align: center;
  font-size: 13px;
  line-height: 1.25;
  white-space: pre-line;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.sim-slot.empty { color: #aaa; }
.sim-slot.drag-over { outline: 3px solid #333; }
.sim-help {
  font-size: 12px;
  color: #666;
  margin-top: 6px;
}
@media screen and (min-width: 700px) and (max-width: 800px) {
  #simulator { padding: 6px; }
  #simulator .sim-panel { width: 100%; }
  .sim-slot { min-height: 68px; font-size: 13px; }
}

</style>
</head>

<body>
<div class="topbar">
<input type="text" id="search" placeholder="検索（番号・名前・場所・詳細・ID）"
style="
  width:250px;
  padding:2px 4px;
  font-size:12px;
   margin-bottom: 0;
  "
>
<button onclick="prevPage()">← BACK</button>
<input
  type="number"
  id="pageInput"
  min="1"
  style="
  width:30px;
  padding:2px 4px;
  font-size:12px;
  "
>
<span id="totalPages"></span>

<button onclick="nextPage()">NEXT →</button>
<button id="missingBtn">欠番</button>
<button id="simulatorBtn">配置シミュレーター</button>
<button onclick="clearFilters()">□</button>
<div class="legend">
  L:ﾗﾝﾄﾞ　S:ｼｰ　B:ﾎﾞﾝﾎﾞﾔｰｼﾞｭ　D:ﾘｿﾞｰﾄﾗｲﾝ　H:ﾎﾃﾙ　A:特別付録　LS:共通
</div>
<div id="typeFilters" class="filters"></div>
<select id="locationSelect">
  <option value="">すべて</option>
</select>

<select id="nameSelect">
  <option value="">すべて</option>
</select>
</div>

<div id="simulator">
  <div class="sim-panel">
    <div class="sim-header">
      <strong>スーベニアメダル配置シミュレーター</strong>
      <button id="simClose">閉じる</button>
    </div>

    <div class="sim-controls">
      <label>面数
        <select id="simFaces">
          <option value="3">3面</option>
          <option value="4">4面</option>
        </select>
      </label>

      <label>ローマ数字
        <select id="simRoman"></select>

<script>
(function () {
  function romanValue(s) {
    const v = {I:1,V:5,X:10,L:50,C:100,D:500,M:1000};
    s = String(s || "").trim().toUpperCase();
    let n = 0;
    for (let i = 0; i < s.length; i++) {
      const a = v[s[i]] || 0;
      const b = i + 1 < s.length ? (v[s[i + 1]] || 0) : 0;
      n += a < b ? -a : a;
    }
    return n;
  }

  function sortRomanSelects() {
    document.querySelectorAll("select").forEach(select => {
      const options = Array.from(select.options);
      const romanOptions = options.filter(o =>
        /^[IVXLCDM]+$/i.test(o.textContent.trim())
      );
      if (!romanOptions.length) return;

      const all = options.find(o => o.textContent.trim() === "すべて");
      romanOptions.sort((a, b) =>
        romanValue(b.textContent) - romanValue(a.textContent)
      );

      const fragment = document.createDocumentFragment();
      if (all) fragment.appendChild(all);
      romanOptions.forEach(o => fragment.appendChild(o));
      select.appendChild(fragment);
    });
  }

  document.addEventListener("DOMContentLoaded", sortRomanSelects);

  // シミュレーターを開いた直後など、動的生成にも対応
  const observer = new MutationObserver(() => sortRomanSelects());
  observer.observe(document.body, { childList: true, subtree: true });
})();
</script>

</body>
</html>
