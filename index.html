<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081a36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ロルカナ未取得">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ロルカナ 未取得カード</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #f5f5f5;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                 "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  }

  html, body {
    width: 100%;
    min-height: 100%;
    overscroll-behavior-y: contain;
  }

  body {
    min-height: 100dvh;
    padding-top: env(safe-area-inset-top);
    padding-right: env(safe-area-inset-right);
    padding-left: env(safe-area-inset-left);
    padding-bottom: env(safe-area-inset-bottom);
    overflow-x: hidden;
  }

  #header {
    width: 100%;
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(10px);
    padding: 10px 10px 8px;
    border-bottom: 1px solid #ddd;
  }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    margin-bottom: 4px;
  }

  .sub-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 36px;
    margin-bottom: 8px;
  }

  #title {
    margin: 0;
    min-width: 0;
    font-size: clamp(16px, 4.8vw, 20px);
    font-weight: 700;
    white-space: nowrap;
  }

  #collectionLink {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    min-height: 36px;
    padding: 6px 12px;
    border: 1px solid #315f9e;
    border-radius: 8px;
    background: #176fc1;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
  }

  #count {
    font-size: 14px;
    color: #666;
    white-space: nowrap;
  }

  #setFilter {
    width: 100%;
    height: 42px;
    margin-bottom: 7px;
    border: 1px solid #ccc;
    border-radius: 10px;
    padding: 0 10px;
    font-size: 16px;
    background: white;
    color: #222;
  }

  #search {
    width: 100%;
    height: 42px;
    border: 1px solid #ccc;
    border-radius: 10px;
    padding: 0 12px;
    font-size: 16px;
    background: white;
    outline: none;
  }

  #search:focus {
    border-color: #888;
  }

  #status {
    margin-top: 7px;
    font-size: 12px;
    color: #777;
    min-height: 16px;
  }

  #gallery {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px;
    padding: 8px 5px 20px;
    align-items: start;
  }

  .card {
    min-width: 0;
    text-align: center;
  }

  .card-image-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 5 / 7;
    background: #eee;
    border-radius: 5px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.18);
  }

  /* Fが1枚以上：金枠 */
  .card-image-wrap.foil:not(.purchased) {
    box-shadow: 0 0 0 3px #d4a017, 0 1px 5px rgba(0,0,0,.25);
  }

  /* 購入済み：赤枠。Fありの場合は内側に金枠も残す */
  .card-image-wrap.purchased {
    box-shadow: 0 0 0 3px #b91c1c, 0 1px 5px rgba(0,0,0,.25);
  }

  .card-image-wrap.purchased.foil {
    box-shadow: 0 0 0 3px #b91c1c,
                inset 0 0 0 3px #d4a017,
                0 1px 5px rgba(0,0,0,.25);
  }

  /* 購入済み：赤いハンコ風スタンプ */
  .card-image-wrap.purchased::after {
    content: "購入済";
    position: absolute;
    top: 10px; right: 8px; z-index: 2;
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    box-sizing: border-box;
    border: 3px solid #b91c1c;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    color: #b91c1c;
    font-size: 12px; font-weight: 900;
    letter-spacing: 1px; text-align: center;
    transform: rotate(-12deg);
    pointer-events: none; opacity: .9;
  }

  .card-image-wrap.purchased::before {
    content: "";
    position: absolute;
    top: 14px; right: 12px; z-index: 2;
    width: 40px; height: 40px;
    border: 1px solid #b91c1c; border-radius: 50%;
    transform: rotate(-12deg);
    pointer-events: none; opacity: .75;
  }

  .card-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    cursor: pointer;
    background: transparent;
    -webkit-tap-highlight-color: transparent;
  }

  .zoom-button {
    display: block;
    width: 100%;
    margin-top: 4px;
    padding: 5px 8px;
    border: 1px solid #bbb;
    border-radius: 6px;
    background: #fff;
    color: #333;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
  }

  .zoom-button:active {
    background: #eee;
  }

  .no-image {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 12px;
    background: transparent;
  }

  .card-code {
    margin-top: 3px;
    font-size: 14px;
    line-height: 1.05;
    font-weight: 700;
    word-break: break-all;
  }

  .card-name {
    margin-top: 2px;
    font-size: 11px;
    line-height: 1.15;
    min-height: 25px;
    word-break: break-word;
  }

  .card-rarity {
    margin-top: 1px;
    font-size: 10px;
    color: #777;
    line-height: 1.1;
  }

  .card-counts {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 3px;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.1;
  }

  .count-n,
  .count-f {
    white-space: nowrap;
  }

  .count-n {
    color: #555;
  }

  .count-f {
    color: #7a4d00;
  }

  .count-f.active {
    color: red;
    font-size: 14px;
    font-weight: 800;
  }

  #empty {
    display: none;
    text-align: center;
    padding: 50px 20px;
    color: #777;
  }

  #loading {
    text-align: center;
    padding: 50px 20px;
    color: #777;
  }

  #modal {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.94);
    padding: 20px;
  }

  #modal.show {
    display: flex;
  }

  #modal-img {
    max-width: 100%;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 5px;
  }

  #close {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    right: 18px;
    color: white;
    font-size: 38px;
    line-height: 1;
    cursor: pointer;
    z-index: 2;
  }

  @media (min-width: 700px) {
    #gallery {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      padding: 10px;
    }

    .card-code {
      font-size: 16px;
    }

    .card-name {
      font-size: 12px;
    }
  }
</style>
</head>

<body>

<header id="header">
  <div class="title-row">
    <h1 id="title">ロルカナ 未取得カード</h1>
  </div>

  <div class="sub-title-row">
    <a id="collectionLink" href="./collection.html">コレクション表</a>
    <div id="count">読み込み中...</div>
  </div>

  <select id="setFilter" aria-label="カードセット選択">
    <option value="">すべてのJA</option>
  </select>

  <input
    id="search"
    type="search"
    placeholder="カード番号・カード名で検索"
    autocomplete="off"
    autocapitalize="off"
    spellcheck="false"
  >

  <div id="status"></div>
</header>

<div id="loading">未取得カードデータを読み込んでいます...</div>
<div id="empty">該当する未取得カードがありません。</div>
<div id="gallery"></div>

<div id="modal">
  <span id="close">×</span>
  <img id="modal-img" alt="">
</div>

<script>
"use strict";

let allCards = [];
let filteredCards = [];

const gallery = document.getElementById("gallery");
const search = document.getElementById("search");
const setFilter = document.getElementById("setFilter");
const count = document.getElementById("count");
const status = document.getElementById("status");
const loading = document.getElementById("loading");
const empty = document.getElementById("empty");
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modal-img");
const close = document.getElementById("close");

// iPad側だけで管理する「購入済み」情報
const PURCHASED_KEY = "lorcana_ipad_purchased_v1";
let purchasedCards = loadPurchasedCards();

function loadPurchasedCards() {
  try {
    const saved = localStorage.getItem(PURCHASED_KEY);
    const list = saved ? JSON.parse(saved) : [];
    return new Set(Array.isArray(list) ? list.map(String) : []);
  } catch (error) {
    console.warn("購入情報の読み込みに失敗しました", error);
    return new Set();
  }
}

function savePurchasedCards() {
  localStorage.setItem(PURCHASED_KEY, JSON.stringify([...purchasedCards]));
}

function getCardKey(card) {
  return String(card.code || card.id || card.image || card.name || "");
}

function togglePurchased(card, wrap) {
  const key = getCardKey(card);
  if (!key) return;

  if (purchasedCards.has(key)) {
    purchasedCards.delete(key);
  } else {
    purchasedCards.add(key);
  }

  savePurchasedCards();
  wrap.classList.toggle("purchased", purchasedCards.has(key));
}

function normalize(value) {
  return String(value ?? "")
    .normalize("NFKC")
    .toLowerCase()
    .replace(/[\\s\\-_]/g, "");
}

function cardSearchText(card) {
  return normalize([
    card.code,
    card.name,
    card.image,
    card.rarity,
    card.version,
    card.set,
    card.type
  ].join(" "));
}

function getImageData(card) {
  if (card.imageData && typeof card.imageData === "string") {
    return card.imageData;
  }

  // 将来 imageData の名前が変わった場合にも対応
  if (card.imageBase64 && typeof card.imageBase64 === "string") {
    return card.imageBase64.startsWith("data:")
      ? card.imageBase64
      : "data:image/webp;base64," + card.imageBase64;
  }

  return "";
}

function getJASet(code) {
  const text = String(code ?? "").trim().toUpperCase();
  const match = text.match(/^JA(\d+)(?:[-_]|$)/);
  return match ? `JA${Number(match[1])}` : "";
}

function buildSetFilter() {
  const values = [...new Set(
    allCards
      .map(card => getJASet(card.code))
      .filter(Boolean)
  )];

  values.sort((a, b) => {
    const na = Number(a.slice(2));
    const nb = Number(b.slice(2));
    return na - nb;
  });

  const current = setFilter.value;

  setFilter.innerHTML = '<option value="">すべてのJA</option>';

  for (const value of values) {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = value;
    setFilter.appendChild(option);
  }

  if (values.includes(current)) {
    setFilter.value = current;
  }
}

function render() {
  gallery.innerHTML = "";

  const keyword = normalize(search.value);

  const selectedSet = setFilter.value;

  filteredCards = allCards.filter(card => {
    const matchesSet =
      !selectedSet || getJASet(card.code) === selectedSet;

    const matchesSearch =
      !keyword || cardSearchText(card).includes(keyword);

    return matchesSet && matchesSearch;
  });

  count.textContent = `${filteredCards.length} / ${allCards.length}枚`;

  empty.style.display = filteredCards.length ? "none" : "block";

  const fragment = document.createDocumentFragment();

  for (const card of filteredCards) {
    const item = document.createElement("div");
    item.className = "card";

    const wrap = document.createElement("div");
    wrap.className = "card-image-wrap";

    const imageData = getImageData(card);

    const cardKey = getCardKey(card);
    if (purchasedCards.has(cardKey)) {
      wrap.classList.add("purchased");
    }

    if (imageData) {
      const img = document.createElement("img");
      img.className = "card-image";
      img.loading = "lazy";
      img.decoding = "async";
      img.src = imageData;
      img.alt = card.name || card.code || "";
      img.title = "タッチすると購入済み／未購入を切り替えます";

      // 画像タッチ：購入済み／未購入を切り替え
      img.addEventListener("click", () => {
        togglePurchased(card, wrap);
      });

      wrap.appendChild(img);

      // 拡大は専用ボタンに分離
      const zoomButton = document.createElement("button");
      zoomButton.type = "button";
      zoomButton.className = "zoom-button";
      zoomButton.textContent = "🔍 拡大";
      zoomButton.addEventListener("click", () => {
        modalImg.src = imageData;
        modalImg.alt = img.alt;
        modal.classList.add("show");
      });
      item.appendChild(wrap);
      item.appendChild(zoomButton);
    } else {
      const noImage = document.createElement("div");
      noImage.className = "no-image";
      noImage.textContent = "画像なし";
      wrap.appendChild(noImage);
    }

    if (!imageData) {
      item.appendChild(wrap);
    }

    const code = document.createElement("div");
    code.className = "card-code";
    code.textContent = card.code || "";
    item.appendChild(code);

    const name = document.createElement("div");
    name.className = "card-name";
    name.textContent = card.name || "";
    item.appendChild(name);

    if (card.rarity) {
      const rarity = document.createElement("div");
      rarity.className = "card-rarity";
      rarity.textContent = card.rarity;
      item.appendChild(rarity);
    }

    // PC側の印刷データと同じN/F枚数を表示
    const normal = Number(card.normal ?? 0);
    const foil = Number(card.foil ?? 0);

    // Fが1枚以上なら金枠を付ける（購入済みの赤枠とは独立）
    wrap.classList.toggle("foil", foil >= 1);

    const counts = document.createElement("div");
    counts.className = "card-counts";

    const normalText = document.createElement("span");
    normalText.className = "count-n";
    normalText.textContent = `N：${normal}`;

    const foilText = document.createElement("span");
    foilText.className =
      foil >= 1 ? "count-f active" : "count-f";
    foilText.textContent = `F：${foil}`;

    counts.append(normalText, foilText);
    item.appendChild(counts);

    fragment.appendChild(item);
  }

  gallery.appendChild(fragment);
}

async function loadData() {
  try {
    /*
      データ読み込み方式
      ① まず従来の missing.json を試す
      ② なければ missing_001.json, missing_002.json, ... を自動で読み込む
      ③ split JSON は何個に増えても、連番である限りHTMLの変更不要
    */

    async function fetchJson(fileName) {
      // 25MB未満の missing.json は分割せず、そのまま読み込む。
      // 通信に時間がかかる場合があるため、固定時間で中断しない。
      // URLを毎回変えず、ブラウザのHTTPキャッシュを利用しながら更新を確認する。
      // no-cache はキャッシュを無条件に使う設定ではなく、サーバーに更新確認を行う。
      const response = await fetch("./" + fileName, {
        cache: "no-cache"
      });

      if (response.status === 404) return null;
      if (!response.ok) {
        throw new Error(`${fileName} の取得に失敗しました（HTTP ${response.status}）`);
      }

      try {
        return await response.json();
      } catch (error) {
        throw new Error(`${fileName} のJSON解析に失敗しました。ファイルの内容を確認してください。`);
      }
    }

    let data = await fetchJson("missing.json");
    let updatedAt = data?.updatedAt ?? null;

    if (data === null) {
      // 分割版を自動読み込み
      const parts = [];

      for (let partNo = 1; ; partNo++) {
        const fileName =
          `missing_${String(partNo).padStart(3, "0")}.json`;

        loading.textContent = `${fileName} を読み込んでいます...`;
        status.textContent = `読み込み済み：${parts.length}枚`;
        const partData = await fetchJson(fileName);

        // 連番の次が存在しなければ終了
        if (partData === null) {
          break;
        }

        const cards = Array.isArray(partData)
          ? partData
          : Array.isArray(partData.cards)
            ? partData.cards
            : null;

        if (!cards) {
          throw new Error(`${fileName} に cards がありません`);
        }

        parts.push(...cards);

        if (!updatedAt && partData.updatedAt) {
          updatedAt = partData.updatedAt;
        }

        // totalParts が入っている場合は、必要数まで読み込んだら終了
        if (
          Number.isFinite(Number(partData.totalParts)) &&
          partNo >= Number(partData.totalParts)
        ) {
          break;
        }
      }

      if (parts.length === 0) {
        throw new Error(
          "missing.json または missing_001.json 以降のデータが見つかりません。GitHubにJSONが配置されているか確認してください。"
        );
      }

      allCards = parts;
    } else if (Array.isArray(data)) {
      allCards = data;
    } else if (Array.isArray(data.cards)) {
      allCards = data.cards;
    } else {
      throw new Error("missing.json に cards がありません");
    }

    allCards = allCards.filter(card => card && typeof card === "object");

    // JA01 → JA02 → JA03 … の順、同じJA内はカード番号順
    allCards.sort((a, b) => {
      const aCode = String(a.code ?? "").toUpperCase();
      const bCode = String(b.code ?? "").toUpperCase();

      const aSet = getJASet(aCode);
      const bSet = getJASet(bCode);

      const aSetNo = aSet ? Number(aSet.slice(2)) : 999999;
      const bSetNo = bSet ? Number(bSet.slice(2)) : 999999;

      if (aSetNo !== bSetNo) {
        return aSetNo - bSetNo;
      }

      const aMatch = aCode.match(/(\d+)$/);
      const bMatch = bCode.match(/(\d+)$/);

      const aNo = aMatch ? Number(aMatch[1]) : 999999;
      const bNo = bMatch ? Number(bMatch[1]) : 999999;

      return aNo - bNo;
    });

    buildSetFilter();

    loading.style.display = "none";

    status.textContent =
      `更新: ${updatedAt ? new Date(updatedAt).toLocaleString("ja-JP") : "不明"}　全${allCards.length}枚`;

    render();

  } catch (error) {
    loading.textContent =
      "未取得カードデータを読み込めませんでした。";

    status.textContent = error.message;

    console.error(error);
  }
}

search.addEventListener("input", render);
setFilter.addEventListener("change", render);

close.addEventListener("click", () => {
  modal.classList.remove("show");
  modalImg.src = "";
});

modal.addEventListener("click", event => {
  if (event.target === modal) {
    modal.classList.remove("show");
    modalImg.src = "";
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    modal.classList.remove("show");
    modalImg.src = "";
  }
});

loadData();
</script>

</body>
</html>
